<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --sky:#68CAFB;        /* 与参考狗狗图一致的天蓝 */
    --navy:#0B2E6F;
    --navy-soft:#15458F;
    --yellow:#FFD22E;
    --coral:#F2542D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:900px;height:383px;overflow:hidden;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    background:var(--sky);
    -webkit-font-smoothing:antialiased;
  }
  .canvas{position:relative;width:900px;height:383px;overflow:hidden;background:var(--sky);}

  /* 插画：左侧放大，右缘柔和淡出 */
  .art{position:absolute;left:0;top:0;height:383px;width:660px;overflow:hidden;
       -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 80%,rgba(0,0,0,0) 100%);
               mask-image:linear-gradient(90deg,#000 0%,#000 80%,rgba(0,0,0,0) 100%);}
  .art img{width:100%;height:100%;object-fit:cover;object-position:16% center;display:block;
           transform:scale(1.0) translateX(10px);transform-origin:left center;}

  /* 文字区：贴近插画 */
  .copy{position:absolute;left:462px;top:50%;transform:translateY(-50%);width:372px;}

  h1{font-size:66px;line-height:1.02;font-weight:800;color:var(--navy);
     letter-spacing:1px;text-shadow:0 3px 0 rgba(255,255,255,.55);}

  .squiggle{display:block;margin:7px 0 12px 2px;}

  .sub{font-size:21px;line-height:1.5;font-weight:700;color:var(--navy);
       letter-spacing:.2px;white-space:nowrap;}
  .sub .hl{background:var(--yellow);color:var(--navy);padding:2px 9px 3px;
           border-radius:7px;display:inline-block;line-height:1.15;vertical-align:-2px;}
  .sub .slash{color:var(--coral);font-weight:800;padding:0 2px;}

  /* 装饰 */
  .star{position:absolute;right:26px;top:24px;width:44px;height:44px;transform:rotate(12deg);}
  .paw{position:absolute;right:44px;bottom:28px;width:30px;height:30px;transform:rotate(-14deg);opacity:.35;}
  .dot{position:absolute;left:472px;top:46px;width:10px;height:10px;border-radius:50%;background:var(--coral);}
  .dot.b{left:486px;top:66px;width:6px;height:6px;background:#FFFFFF;opacity:.9;}
</style>
</head>
<body>
<div class="canvas">
  <div class="art"><img src="{{ART}}" alt=""></div>

  <div class="copy">
    <h1>{{H1}}</h1>
    <svg class="squiggle" width="196" height="14" viewBox="0 0 196 14" fill="none">
      <path d="M3 9C28 3 52 3 76 8c24 5 48 5 72-1 16-4 30-4 45 1"
            stroke="#FFD22E" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <p class="sub">{{SUB}}</p>
  </div>

  <div class="dot"></div>
  <div class="dot b"></div>

  <svg class="star" viewBox="0 0 48 48" fill="none">
    <path d="M24 2l5.2 14.8L44 22l-14.8 5.2L24 42l-5.2-14.8L4 22l14.8-5.2z"
          fill="#FFD22E" stroke="#0B2E6F" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>

  <svg class="paw" viewBox="0 0 40 40" fill="#0B2E6F">
    <ellipse cx="20" cy="26" rx="10" ry="8.5"/>
    <ellipse cx="8" cy="15" rx="4.2" ry="5.4"/>
    <ellipse cx="17" cy="10.5" rx="4.2" ry="5.6"/>
    <ellipse cx="27" cy="11" rx="4.2" ry="5.6"/>
    <ellipse cx="34" cy="17" rx="3.8" ry="5"/>
  </svg>
</div>
</body>
</html>
