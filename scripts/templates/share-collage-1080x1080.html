<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --paper:#F4EAD5;
    --paper-hi:#FFFDF7;
    --navy:#0B2E6F;
    --navy-deep:#08214F;
    --sky:#68CAFB;
    --yellow:#FFD22E;
    --coral:#F2542D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    background:var(--navy);
    -webkit-font-smoothing:antialiased;
  }
  .canvas{position:relative;width:1080px;height:1080px;overflow:hidden;
    background:radial-gradient(1200px 800px at 80% 4%,#123C86 0%,var(--navy) 52%,var(--navy-deep) 100%);}
  .canvas::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(104,202,251,.18) .9px,transparent .9px);
    background-size:26px 26px;opacity:.4;
  }

  .route{position:absolute;left:0;top:0;z-index:0;}

  .serial{position:absolute;right:8px;top:26px;z-index:0;font-size:310px;line-height:1;
    font-weight:800;color:var(--sky);opacity:.065;letter-spacing:-12px;}

  .head{position:absolute;left:80px;top:64px;z-index:4;width:860px;}
  .badge{display:inline-block;background:var(--yellow);color:var(--navy);
    font-weight:800;font-size:23px;letter-spacing:1px;padding:9px 20px 10px;
    border-radius:999px;transform:rotate(-2deg);
    box-shadow:0 5px 0 rgba(0,0,0,.18);}
  .badge .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--coral);margin:0 9px 3px 1px;}

  .eyebrow{margin-top:20px;font-size:23px;font-weight:700;color:var(--sky);
    letter-spacing:4px;}

  h1{margin-top:12px;font-size:92px;line-height:1.12;font-weight:800;
    color:#FFF9EC;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.16);}
  h1 .ai{color:var(--yellow);font-style:normal;position:relative;display:inline-block;}
  h1 .ai::after{content:"";position:absolute;left:2px;right:2px;bottom:6px;height:13px;
    background:var(--coral);opacity:.92;border-radius:6px;z-index:-1;}

  .sub{margin-top:22px;font-size:25px;font-weight:700;color:#CDEBFF;
    letter-spacing:.5px;white-space:nowrap;}
  .sub .slash{color:var(--yellow);font-weight:800;padding:0 4px;}

  .card{position:absolute;background:var(--paper-hi);z-index:3;
    box-shadow:0 22px 40px rgba(4,15,40,.42),0 3px 0 rgba(255,255,255,.16);}
  .card img{display:block;object-fit:cover;object-position:center;}

  .card.photo{left:596px;top:424px;width:358px;padding:14px 14px 0;transform:rotate(5deg);}
  .card.photo img{width:330px;height:248px;object-position:center 62%;}
  .card.photo .cap{height:42px;display:flex;align-items:center;justify-content:center;
    font-family:"KaiTi","STKaiti","Microsoft YaHei",sans-serif;font-size:19px;
    font-weight:700;color:var(--navy);letter-spacing:3px;}

  .card.dog{left:92px;top:452px;width:384px;padding:16px;transform:rotate(-5deg);}
  .card.dog img{width:352px;height:352px;}

  .card.robot{left:428px;top:656px;width:222px;padding:12px;transform:rotate(7deg);z-index:5;}
  .card.robot .ph{width:198px;height:198px;overflow:hidden;}
  .card.robot img{width:100%;height:100%;transform:scale(1.24);}

  .tape{position:absolute;z-index:6;height:34px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 3px,transparent 3px 10px),
               rgba(255,210,46,.66);
    box-shadow:0 3px 6px rgba(4,15,40,.24);}
  .tape.photo{left:712px;top:408px;width:124px;transform:rotate(-4deg);}
  .tape.dog{left:104px;top:434px;width:104px;transform:rotate(-40deg);
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.26) 0 3px,transparent 3px 10px),
               rgba(104,202,251,.58);}
  .tape.robot{left:588px;top:858px;width:96px;transform:rotate(22deg);
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.26) 0 3px,transparent 3px 10px),
               rgba(242,84,45,.50);}

  .stamp{position:absolute;left:136px;top:742px;z-index:6;width:118px;height:118px;
    border-radius:50%;border:3px dashed var(--coral);color:var(--coral);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-12deg);opacity:.9;background:rgba(255,253,247,.30);}
  .stamp .big{font-size:30px;font-weight:800;letter-spacing:4px;line-height:1.05;}
  .stamp .small{font-size:12px;font-weight:700;letter-spacing:2px;margin-top:4px;}

  .star{position:absolute;left:880px;top:360px;z-index:6;width:38px;height:38px;
    transform:rotate(16deg);}

  .footband{position:absolute;left:0;bottom:0;width:1080px;height:172px;z-index:7;
    filter:drop-shadow(0 -8px 20px rgba(4,15,40,.30));}
  .foot{position:absolute;left:84px;right:84px;bottom:22px;height:118px;z-index:8;
    display:flex;align-items:center;justify-content:space-between;}
  .foot-name{font-size:34px;font-weight:800;color:var(--navy);letter-spacing:2px;
    display:flex;align-items:center;gap:12px;}
  .foot-name svg{width:30px;height:30px;}
  .foot-tag{margin-top:8px;font-size:21px;font-weight:700;color:rgba(11,46,111,.72);
    letter-spacing:.5px;}
  .foot-tag .slash{color:var(--coral);font-weight:800;padding:0 3px;}

  .seal{width:108px;height:108px;border-radius:50%;background:var(--yellow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);box-shadow:0 6px 0 rgba(11,46,111,.18);}
  .seal .main{font-size:25px;font-weight:800;color:var(--navy);letter-spacing:1px;}
  .seal .sub{font-size:11px;font-weight:700;color:rgba(11,46,111,.66);
    letter-spacing:1.5px;margin-top:3px;}

  .grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.5;mix-blend-mode:soft-light;}
</style>
</head>
<body>
<div class="canvas">
  <svg class="route" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none">
    <path d="M-20 850C120 780 190 700 300 610c150-123 230-250 390-322 110-50 210-124 410-260"
          stroke="#68CAFB" stroke-opacity=".20" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="3 18"/>
    <circle cx="300" cy="610" r="8" fill="#FFD22E" fill-opacity=".38"/>
    <circle cx="690" cy="288" r="7" fill="#68CAFB" fill-opacity=".5"/>
  </svg>

  <div class="serial">01</div>

  <div class="head">
    <div class="badge"><span class="dot"></span>{{BADGE}}</div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{H1}}</h1>
    <div class="sub">{{SUB}}</div>
  </div>

  <div class="card photo">
    <img src="{{ART_PHOTO}}" alt="">
    <div class="cap">{{PHOTO_CAP}}</div>
  </div>

  <div class="card dog"><img src="{{ART_DOG}}" alt=""></div>
  <div class="card robot"><div class="ph"><img src="{{ART_ROBOT}}" alt=""></div></div>

  <div class="tape photo"></div>
  <div class="tape dog"></div>
  <div class="tape robot"></div>

  <div class="stamp"><span class="big">{{STAMP}}</span><span class="small">{{YEAR}}</span></div>

  <svg class="star" viewBox="0 0 48 48" fill="none">
    <path d="M24 2l5.2 14.8L44 22l-14.8 5.2L24 42l-5.2-14.8L4 22l14.8-5.2z"
          fill="#FFD22E" stroke="#0B2E6F" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>

  <svg class="footband" width="1080" height="172" viewBox="0 0 1080 172" preserveAspectRatio="none">
    <path d="M0 26L36 16L72 30L108 18L144 30L180 16L216 28L252 17L288 31L324 18L360 29L396 15L432 28L468 18L504 31L540 17L576 28L612 15L648 30L684 19L720 29L756 16L792 28L828 18L864 31L900 17L936 29L972 15L1008 27L1044 18L1080 28L1080 172L0 172Z"
          fill="#F4EAD5"/>
    <path d="M0 26L36 16L72 30L108 18L144 30L180 16L216 28L252 17L288 31L324 18L360 29L396 15L432 28L468 18L504 31L540 17L576 28L612 15L648 30L684 19L720 29L756 16L792 28L828 18L864 31L900 17L936 29L972 15L1008 27L1044 18L1080 28"
          stroke="#FFD22E" stroke-opacity=".75" stroke-width="4" fill="none"/>
  </svg>

  <div class="foot">
    <div>
      <div class="foot-name">
        <svg viewBox="0 0 40 40" fill="#0B2E6F">
          <ellipse cx="20" cy="26" rx="9" ry="7.5"/>
          <ellipse cx="9" cy="16" rx="3.8" ry="4.9"/>
          <ellipse cx="17" cy="11.5" rx="3.8" ry="5.1"/>
          <ellipse cx="26" cy="12" rx="3.8" ry="5.1"/>
          <ellipse cx="33" cy="17.5" rx="3.4" ry="4.5"/>
        </svg>
        {{FOOT}}
      </div>
      <div class="foot-tag">{{FOOT_TAG}}</div>
    </div>
    <div class="seal">
      <span class="main">第 {{EP}} 篇</span>
      <span class="sub">共 {{TOTAL}} 篇</span>
    </div>
  </div>

  <svg class="grain" width="1080" height="1080">
    <filter id="shareGrain"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#shareGrain)" opacity=".2"/>
  </svg>
</div>
</body>
</html>
