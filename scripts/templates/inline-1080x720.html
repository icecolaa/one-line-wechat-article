<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{ --sky:#68CAFB; --navy:#0B2E6F; --yellow:#FFD22E; --coral:#F2542D; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:720px;overflow:hidden;}
  body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
       background:var(--sky);-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1080px;height:720px;overflow:hidden;background:var(--sky);}
  .art{position:absolute;inset:0;}
  .art img{width:100%;height:100%;object-fit:cover;display:block;}

  /* 底部字幕条：给插图一个落点，也让中文完全走 HTML 排版 */
  .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 44px 28px;
       background:linear-gradient(180deg,rgba(11,46,111,0) 0%,rgba(11,46,111,.86) 46%,rgba(11,46,111,.94) 100%);}
  .cap p{font-size:34px;line-height:1.42;font-weight:800;color:#fff;letter-spacing:.6px;
         text-shadow:0 2px 6px rgba(0,0,0,.25);}
  .cap p .hl{color:var(--yellow);}
  .cap .tag{display:inline-block;font-size:20px;font-weight:800;color:var(--navy);
            background:var(--yellow);border-radius:999px;padding:5px 14px 6px;margin-bottom:12px;
            letter-spacing:1px;}
  .cap.empty{display:none;}
</style>
</head>
<body>
<div class="canvas">
  <div class="art"><img src="{{ART}}" alt=""></div>
  <div class="cap{{CAP_CLASS}}">
    {{TAG}}
    <p>{{CAPTION}}</p>
  </div>
</div>
</body>
</html>
