<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --sky:#68CAFB;
    --navy:#0B2E6F;
    --yellow:#FFD22E;
    --coral:#F2542D;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:900px;height:383px;overflow:hidden;}
  body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
       background:#DCEFFD;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:900px;height:383px;overflow:hidden;
    background:radial-gradient(120% 150% at 12% 8%, #F2FAFF 0%, #D8EEFD 46%, #BFE4FB 100%);}

  /* 细网格底纹，压住纯色背景的空 */
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(11,46,111,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(11,46,111,.055) 1px,transparent 1px);
    background-size:34px 34px;}

  .copy{position:absolute;left:84px;top:50%;transform:translateY(-50%);width:400px;z-index:3;}
  .badge{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:800;font-size:19px;
    padding:7px 15px 8px;border-radius:999px;transform:rotate(-2deg);
    box-shadow:0 4px 0 rgba(11,46,111,.22);letter-spacing:.6px;}
  h1{margin-top:20px;font-size:60px;line-height:1.08;font-weight:800;color:var(--navy);
     letter-spacing:2px;text-shadow:0 3px 0 rgba(255,255,255,.7);}
  .squiggle{display:block;margin:12px 0 12px 3px;}
  .sub{font-size:22px;line-height:1.4;font-weight:700;color:#15458F;letter-spacing:.4px;white-space:nowrap;}
  .sub .slash{color:var(--coral);font-weight:800;padding:0 3px;}

  /* 右侧两台手机：错落叠放，露出行程与记账 */
  .phones{position:absolute;right:36px;top:0;width:370px;height:383px;z-index:2;}
  .phone{position:absolute;border-radius:20px;overflow:hidden;background:#fff;
    box-shadow:0 14px 34px rgba(11,46,111,.28), 0 0 0 5px #fff, 0 0 0 6px rgba(11,46,111,.10);}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
  .phone.a{width:196px;height:352px;right:148px;top:8px;transform:rotate(-6deg);}
  .phone.b{width:176px;height:300px;right:0;top:64px;transform:rotate(5deg);}

  .star{position:absolute;right:30px;top:14px;width:34px;height:34px;transform:rotate(12deg);z-index:4;}
</style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>

  <div class="copy">
    <div class="badge">{{BADGE}}</div>
    <h1>{{H1}}</h1>
    <svg class="squiggle" width="196" height="14" viewBox="0 0 196 14" fill="none">
      <path d="M3 9C28 3 52 3 76 8c24 5 48 5 72-1 16-4 30-4 45 1"
            stroke="#FFD22E" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <p class="sub">{{SUB}}</p>
  </div>

  <div class="phones">
    <div class="phone a"><img src="{{ART1}}" alt=""></div>
    <div class="phone b"><img src="{{ART2}}" alt=""></div>
  </div>

  <svg class="star" viewBox="0 0 48 48" fill="none">
    <path d="M24 2l5.2 14.8L44 22l-14.8 5.2L24 42l-5.2-14.8L4 22l14.8-5.2z"
          fill="#FFD22E" stroke="#0B2E6F" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
</div>
</body>
</html>
